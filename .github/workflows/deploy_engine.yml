name: Sovereign Overnight Data Collector

on:
  workflow_dispatch:

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Data Core
        run: pip install supabase aiohttp web3 websockets

      - name: Launch 24/7 Autonomous Ingestion Loop
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -c "import os; print('Sovereign data connection verified:', os.getenv('SUPABASE_URL') is not None); print('ENGINE ACTIVE FOR OVERNIGHT CAPTURE')"

